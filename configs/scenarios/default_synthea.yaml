scenario:
  id: default_synthea
  name: "Default fixed-seed Synthea generation scenario"
  description: >
    Fixed scenario for generating or documenting the synthetic patient population used
    in the Phase 1 T2DM cohort pipeline.

synthea:
  generator: "Synthea"
  seed: 20260601
  reference_date: "2026-06-01"
  population_size: 100000
  state: null
  city: null
  export_format: "csv"
  export_metadata: true

paths:
  raw_dir: "data/raw/synthea/default"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  omop_lite_sqlite_path: "data/gold/omop_lite.sqlite3"
  manifest_dir: "reports/manifests"

expected_raw_tables:
  required:
    - "patients.csv"
    - "encounters.csv"
    - "conditions.csv"
    - "medications.csv"
    - "observations.csv"
    - "procedures.csv"
    - "careplans.csv"
  optional:
    - "allergies.csv"
    - "immunizations.csv"
    - "devices.csv"
    - "payer_transitions.csv"
    - "payers.csv"
    - "providers.csv"
    - "organizations.csv"
    - "claims.csv"
    - "claims_transactions.csv"

pipeline:
  steps:
    - id: "raw_inventory"
      name: "Inventory raw Synthea CSV files"
      output: "reports/manifests/raw_inventory.json"

    - id: "raw_to_bronze"
      name: "Convert raw CSV files to typed Parquet"
      output: "data/bronze"

    - id: "bronze_to_silver"
      name: "Normalize patient, encounter, condition, medication, observation, procedure, and careplan tables"
      output: "data/silver"

    - id: "silver_to_omop_lite"
      name: "Map normalized Synthea entities into OMOP-lite SQLite tables"
      output: "data/gold/omop_lite.sqlite3"

    - id: "cohort_extract"
      name: "Apply deterministic T2DM Phase 1 cohort criteria"
      output: "data/gold/t2dm_phase1_cohort.parquet"

    - id: "analysis_outputs"
      name: "Generate attrition, baseline, treatment-pattern, utilization, and cost summaries"
      output: "reports"

quality_checks:
  require_nonempty_required_tables: true
  require_patient_id_consistency: true
  require_date_parse_success: true
  require_no_future_dates_after_reference_date: true
  require_manifest_for_each_run: true
  require_raw_file_hashes: true

metadata:
  version: "0.1.0"
  status: "draft"
  notes:
    - "Do not treat this scenario as locked until the first raw Synthea export is generated and inventoried."
    - "Population size may be reduced during early local testing, then restored for poster-ready runs."
