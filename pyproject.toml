[project]
name = "heor-synth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.3",
    "lifelines>=0.30.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "polars>=1.41.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "statsmodels>=0.14.6",
    "typer>=0.26.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
